<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Family Tree</title>
    <script>
      /*
        Night mode, applied before the first paint (#11).

        The account's choice lives in user_settings and is fetched by
        ThemeProvider, which cannot answer before the page draws. This reads
        the copy the last visit cached in localStorage so a night-mode reader
        never gets a white flash on the way in. Keys and values match
        src/utils/theme.ts: 'system' | 'light' | 'dark'.
      */
      (function () {
        try {
          var choice = window.localStorage.getItem('aft.theme') || 'system';
          var dark = choice === 'dark'
            || (choice === 'system'
                && window.matchMedia
                && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* private window, or site data blocked: the light theme is the default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
